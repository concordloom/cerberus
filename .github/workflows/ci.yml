# A verification gate that is itself unverified would be self-refuting.
#
# The failure mode that matters here is the quiet one: a hook that never fires
# looks exactly like a project where nothing is ever wrong. The tests below
# assert both directions — that the gate blocks an over-claim, and that it stays
# out of the way during ordinary work.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest supported runtime is not a formality: the hooks ship into
        # other people's projects, and that is where a version-specific syntax
        # error would surface instead of here.
        python-version: ["3.10", "3.13"]
    name: Hooks (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        # `compileall` on a missing path prints a complaint and exits 0, so the
        # path is asserted first. This step silently compiled nothing after the
        # hooks moved under plugins/ and stayed green throughout.
        run: |
          test -d plugins/cerberus/hooks
          python3 -m compileall -q plugins/cerberus/hooks scripts tests
      - name: Test
        run: python3 tests/test_hooks.py

      # The two slash commands drive the whole working cycle and had no check
      # of any kind: check_parity.py globs plugins/*/skills/*, nothing here
      # touched .claude/commands/, and `claude plugin validate` accepts
      # frontmatter that is known broken. That is how a zero-indexed `$1`
      # survived in the entry-point command until someone ran it by hand.
      - name: Commands are well formed
        run: |
          python3 scripts/check_commands.py
          python3 tests/test_commands.py

      # Setup is the first thing a new user meets, and two of its properties
      # are usually untestable: that it proves the gate fires rather than
      # claiming it, and that what the user reads is free of vocabulary that
      # means nothing to them. Both are pinned to checks that can fail.
      - name: Setup works, and reads like something a person would write
        run: python3 tests/test_setup.py

      # The quick start's command is extracted from README.md and run over the
      # network, because the difference between the script beside the page and
      # the script the page points at is exactly where an install breaks — and
      # a front page whose command was never run is this project's own failure
      # printed on its own door.
      - name: The README's quick start actually works
        if: matrix.python-version == '3.12' || matrix.python-version == '3.13'
        run: python3 tests/test_readme.py

  docs:
    runs-on: ubuntu-latest
    name: Translation parity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Two language versions drift silently: a section gets added to one and
      # not the other, and whoever follows the stale one misses a step.
      - name: English and Russian describe the same thing
        run: python3 scripts/check_parity.py
      - name: Example configuration is valid JSON
        run: |
          python3 -c "import json; json.load(open('cerberus.example.json'))"
          python3 -c "import json; json.load(open('examples/settings.json'))"
      # A malformed issue form does not error anywhere — GitHub quietly falls
      # back to a blank issue, and the one field the cycle depends on stops
      # being asked for. Nothing else in this repository would notice.
      - name: Issue forms parse
        run: |
          # Not in the runner's Python, though it is in most local ones — which
          # is how this step failed the first time it ran.
          pip install --quiet pyyaml
          python3 - <<'PY'
          import pathlib, sys, yaml

          for path in sorted(pathlib.Path(".github/ISSUE_TEMPLATE").glob("*.yml")):
              data = yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"ok: {path}")
              if path.name == "config.yml":
                  continue
              required = [
                  f["id"] for f in data["body"]
                  if f.get("validations", {}).get("required")
              ]
              if "oracle" not in required:
                  print(f"{path}: the 'what would settle it' field must stay required", file=sys.stderr)
                  sys.exit(1)
          PY

  plugin:
    runs-on: ubuntu-latest
    name: Plugin and installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A malformed manifest makes the whole plugin fail to load, and the
      # marketplace is the path most people will use.
      - name: Manifests are valid and point at files that exist
        run: |
          python3 - <<'PY'
          import json, pathlib, sys

          market = json.load(open(".claude-plugin/marketplace.json"))
          root = pathlib.Path(market.get("metadata", {}).get("pluginRoot", "."))
          problems = []

          for entry in market["plugins"]:
              # The loader rejects a bare name even when metadata.pluginRoot is
              # set, with "source: Invalid input". The documentation permits that
              # form; the loader is the authority. Caught 2026-08-15 by a real
              # install, after every static check had passed.
              if not str(entry["source"]).startswith("./"):
                  problems.append(f"{entry['name']}: source must be an explicit relative path, got {entry['source']!r}")
                  continue
              plugin_dir = pathlib.Path(root) / entry["source"]
              manifest = plugin_dir / ".claude-plugin" / "plugin.json"
              if not manifest.exists():
                  problems.append(f"{entry['name']}: no manifest at {manifest}")
                  continue
              plugin = json.load(open(manifest))
              if plugin["name"] != entry["name"]:
                  problems.append(f"{entry['name']}: name disagrees with plugin.json ({plugin['name']})")
              if plugin.get("version") != entry.get("version"):
                  problems.append(f"{entry['name']}: version disagrees with plugin.json")
              # skills/ and hooks/hooks.json are loaded by convention. Naming
              # them in the manifest registers the same files twice and the
              # plugin fails to load *after* installing successfully - which
              # reads as a working install right up until the first hook should
              # have fired. Caught 2026-08-15.
              for key in ("skills", "hooks"):
                  if key in plugin:
                      problems.append(f"{entry['name']}: plugin.json must not declare {key!r} - it is loaded by convention and declaring it duplicates the load")
              hooks_file = plugin_dir / "hooks" / "hooks.json"
              if not hooks_file.exists():
                  problems.append(f"{entry['name']}: no hooks/hooks.json at the conventional path")
                  continue
              skills_dir = plugin_dir / "skills"
              if not skills_dir.is_dir():
                  problems.append(f"{entry['name']}: no skills/ directory at the conventional path")
              hooks = json.load(open(hooks_file))
              for event, entries in hooks["hooks"].items():
                  for e in entries:
                      for h in e["hooks"]:
                          script = h["command"].split("}")[-1].strip('"').lstrip("/")
                          if not (plugin_dir / script).exists():
                              problems.append(f"{entry['name']}: {event} hook missing {script}")

          if problems:
              print("\n".join("- " + p for p in problems), file=sys.stderr)
              sys.exit(1)
          print("manifests ok")
          PY

      # The one-liner is what the README puts first, and it exercises code the
      # clone path never reaches: piped through sh there is no source tree beside
      # the script, so it has to fetch its own payload over the network. Pinned
      # to this revision rather than main, or the test would pass on someone
      # else's commit.
      - name: The one-liner installs without a clone
        env:
          CERBERUS_REF: ${{ github.sha }}
        run: |
          mkdir -p /tmp/oneliner && cd /tmp/oneliner
          cat "$GITHUB_WORKSPACE/install.sh" | sh -s -- --codex
          test -f .agents/skills/cerberus/SKILL.md

      # The installer is what people run when they are not on Claude Code, and
      # a broken one fails in someone else's repository rather than here.
      - name: Installer produces a working project
        run: |
          mkdir -p /tmp/proj && cd /tmp/proj
          sh "$GITHUB_WORKSPACE/install.sh" --claude
          test -f .claude/skills/cerberus/SKILL.md
          test -f .claude/hooks/cerberus_gate.py
          test -f .claude/cerberus.json
          python3 -c "import json; json.load(open('.claude/settings.json'))"

          # It must be idempotent: people re-run installers.
          sh "$GITHUB_WORKSPACE/install.sh" --claude
          python3 - <<'PY'
          import json
          hooks = json.load(open("/tmp/proj/.claude/settings.json"))["hooks"]
          assert len(hooks["PostToolUse"]) == 1, hooks
          assert len(hooks["Stop"]) == 1, hooks
          print("installer is idempotent")
          PY

          # Refusals ship off, so a fresh install must be silent...
          echo '{"cwd":"/tmp/proj","tool_input":{"file_path":"app/x.py"}}' \
            | python3 .claude/hooks/cerberus_mark.py
          test ! -f /tmp/proj/.claude/.cerberus-pending
          printf '%s\n' '{"role":"assistant","message":{"content":"done, it works"}}' > /tmp/t0.jsonl
          test -z "$(echo '{"cwd":"/tmp/proj","transcript_path":"/tmp/t0.jsonl"}' \
            | python3 .claude/hooks/cerberus_gate.py)"
          echo "a fresh install does not interrupt anything"

          # Both silent cases above are taken with enforcement OFF, which cannot
          # tell a gate that never fires from one that always does. So the
          # silent direction is taken again with it ON: a turn that claims
          # nothing must end freely.
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("/tmp/proj/.claude/cerberus.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          d["enforce"] = True
          p.write_text(json.dumps(d, indent=2) + "\n", encoding="utf-8")
          PY
          echo '{"cwd":"/tmp/proj","tool_input":{"file_path":"app/y.py"}}' \
            | python3 .claude/hooks/cerberus_mark.py
          printf '%s\n' '{"role":"assistant","message":{"content":"still working on it"}}' > /tmp/t1.jsonl
          test -z "$(echo '{"cwd":"/tmp/proj","transcript_path":"/tmp/t1.jsonl"}' \
            | python3 .claude/hooks/cerberus_gate.py)"
          rm -f /tmp/proj/.claude/.cerberus-pending
          printf '%s\n' '{"role":"assistant","message":{"content":"done, it works"}}' > /tmp/t2.jsonl
          test -z "$(echo '{"cwd":"/tmp/proj","transcript_path":"/tmp/t2.jsonl"}' \
            | python3 .claude/hooks/cerberus_gate.py)"
          echo "an enforcing gate still lets ordinary turns end"

          # ...and must refuse once the project asks.
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("/tmp/proj/.claude/cerberus.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          d["enforce"] = True
          p.write_text(json.dumps(d, indent=2) + "\n", encoding="utf-8")
          PY
          echo '{"cwd":"/tmp/proj","tool_input":{"file_path":"app/x.py"}}' \
            | python3 .claude/hooks/cerberus_mark.py
          printf '%s\n' '{"role":"assistant","message":{"content":"done, it works"}}' > /tmp/t.jsonl
          echo '{"cwd":"/tmp/proj","transcript_path":"/tmp/t.jsonl"}' \
            | python3 .claude/hooks/cerberus_gate.py \
            | python3 -c "import json,sys; assert json.load(sys.stdin)['decision']=='block'; print('installed gate blocks over-claims')"
